# ============================================
# Docker Compose - Development
# ============================================
# Usage: docker-compose up
# - Phoenix endpoint: http://localhost:4000
# - Mailpit (dev email): http://localhost:8025

version: "3.9"

services:
  # Application
  app:
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "4000:4000"
    environment:
      - MIX_ENV=dev
      - PORT=4000
      # Development only: DATABASE_URL forces a database; otherwise the app
      # probes NEON_DATABASE_URL and falls back to LOCAL_DATABASE_URL (see
      # Alethea.DevDatabase). Values come from .env.
      - DATABASE_URL=${DATABASE_URL:-}
      - NEON_DATABASE_URL=${NEON_DATABASE_URL:-}
      - LOCAL_DATABASE_URL=postgresql://postgres:postgres@db:5432/alethea_dev
      - SECRET_KEY_BASE=dev_secret_key_base_that_is_at_least_64_chars_long_for_production_safety
      - EMOTION_SIDECAR_URL=http://emotion-sidecar:8080
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-phi-4-mini}
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
      emotion-sidecar:
        condition: service_healthy
    volumes:
      - .:/app
    command: mix phx.server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  emotion-sidecar:
    build:
      context: ./services/emotion_sidecar
    volumes:
      - emotion_model_cache:/home/sidecar/.cache/huggingface
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8080/health/ready', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s

  # Database
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=alethea_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit (development email catching)
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_AUTHENTICATE=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

volumes:
  postgres_data:
  phoenix_assets:
  emotion_model_cache:
