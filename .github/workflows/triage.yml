name: Triage

on:
  issues:
    types:
      - opened
      - edited
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - closed
      - ready_for_review

permissions:
  issues: write
  contents: read
  pull-requests: write

jobs:
  auto-triage-new:
    name: New issue → status:needs-triage
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Add needs-triage label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const existing = (issue.labels || []).map(l => l.name);
            const toAdd = ['status:needs-triage'].filter(l => !existing.includes(l));
            if (toAdd.length === 0) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: toAdd,
            });

  handle-slash-command:
    name: /claim, /release, /blocked, /unblocked
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Parse command
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const raw = (context.payload.comment.body || '').trim();
            const firstToken = raw.split(/\s+/)[0].toLowerCase();
            const known = ['/claim', '/release', '/blocked', '/unblocked'];
            if (!known.includes(firstToken)) {
              core.setOutput('run', 'false');
              return;
            }
            const reason = raw.split(/\s+/).slice(1).join(' ').trim();
            core.setOutput('run', 'true');
            core.setOutput('command', firstToken);
            core.setOutput('reason', reason);

      - name: /claim
        if: steps.parse.outputs.command == '/claim'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;
            const author = comment.user.login;
            const association = comment.author_association;
            const currentAssignees = (issue.assignees || []).map(a => a.login);
            const existingLabels = (issue.labels || []).map(l => l.name);

            if (!['MEMBER', 'OWNER'].includes(association)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `🔒 **Solo miembros de la org pueden \`/claim\` issues.** Si querés sumarte al equipo, pedile a un owner que te invite a alethea-org.`,
              });
              return;
            }

            if (existingLabels.includes('wayfinder:prototype') || existingLabels.includes('wayfinder:grilling')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `🚫 Esta issue tiene label \`wayfinder:prototype\` o \`wayfinder:grilling\` — son artefactos HITL. **Solo el PO de la semana la puede manejar.** Si necesitás que avance, etiquetala con \`triage:rotating\` y avisale al PO actual (ver #0 Triage rota).`,
              });
              return;
            }

            if (currentAssignees.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ Esta issue ya está tomada por @${currentAssignees[0]}. Pedile que la libere con \`/release\`.`,
              });
              return;
            }

            await github.rest.issues.addAssignees({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [author],
            });

            const addLabels = ['status:claimed'].filter(l => !existingLabels.includes(l));
            const removeLabels = ['status:needs-triage', 'status:blocked'].filter(l => existingLabels.includes(l));
            if (addLabels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: addLabels,
              });
            }
            if (removeLabels.length) {
              for (const l of removeLabels) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, name: l,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `✅ Issue tomada por @${author}. **Lock activo** — nadie más puede desasignarte.\n\nPara liberarla cuando no puedas seguir: \`/release\`.`,
            });

      - name: /release
        if: steps.parse.outputs.command == '/release'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = context.payload.comment.user.login;
            const currentAssignees = (issue.assignees || []).map(a => a.login);
            const existingLabels = (issue.labels || []).map(l => l.name);

            if (currentAssignees.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `ℹ️ Esta issue no tiene assignee. No hay nada que liberar.`,
              });
              return;
            }

            if (!currentAssignees.includes(author)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `🔒 Solo el assignee actual (@${currentAssignees[0]}) puede liberar esta issue. Si querés tomarla, pedile a @${currentAssignees[0]} que la libere primero.`,
              });
              return;
            }

            await github.rest.issues.removeAssignees({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              assignees: [author],
            });

            const addLabels = ['status:needs-triage'].filter(l => !existingLabels.includes(l));
            const removeLabels = ['status:claimed', 'status:blocked'].filter(l => existingLabels.includes(l));
            if (addLabels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, labels: addLabels,
              });
            }
            if (removeLabels.length) {
              for (const l of removeLabels) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issue.number, name: l,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `🔓 @${author} liberó esta issue. Vuelve a \`status:needs-triage\` — otro dev puede \`/claim\`.`,
            });

      - name: /blocked
        if: steps.parse.outputs.command == '/blocked'
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.parse.outputs.reason }}
        with:
          script: |
            const issue = context.payload.issue;
            const author = context.payload.comment.user.login;
            const currentAssignees = (issue.assignees || []).map(a => a.login);
            const existingLabels = (issue.labels || []).map(l => l.name);
            const reason = (process.env.REASON || '').trim();

            if (currentAssignees.length === 0 || !currentAssignees.includes(author)) {
              const assigneeMsg = currentAssignees.length
                ? `🔒 Solo el assignee actual (@${currentAssignees[0]}) puede bloquear su propia issue.`
                : `ℹ️ Esta issue no tiene assignee — no podés bloquear algo que no es tuyo.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: assigneeMsg,
              });
              return;
            }

            if (!existingLabels.includes('status:blocked')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['status:blocked'],
              });
            }

            const reasonText = reason ? `: ${reason}` : ' (sin razón especificada)';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `🛑 **Bloqueada por @${author}**${reasonText}\n\nPara desbloquear: \`/unblocked\`.`,
            });

      - name: /unblocked
        if: steps.parse.outputs.command == '/unblocked'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const author = context.payload.comment.user.login;
            const currentAssignees = (issue.assignees || []).map(a => a.login);
            const existingLabels = (issue.labels || []).map(l => l.name);

            if (!existingLabels.includes('status:blocked')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `ℹ️ Esta issue no está bloqueada. No hay nada que desbloquear.`,
              });
              return;
            }

            if (currentAssignees.length === 0 || !currentAssignees.includes(author)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `🔒 Solo el assignee actual (@${currentAssignees[0] || 'N/A'}) puede desbloquear esta issue.`,
              });
              return;
            }

            await github.rest.issues.removeLabel({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              name: 'status:blocked',
            });
            if (!existingLabels.includes('status:claimed')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['status:claimed'],
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `🔄 @${author} desbloqueó esta issue. Vuelve a \`status:claimed\`.`,
            });

  hard-lock:
    name: Hard lock sobre asignaciones
    if: github.event_name == 'issues' && github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Read rota
        id: rota
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: '.github/ROTA.yml',
                ref: context.ref,
              });
              const content = Buffer.from(data.content, 'base64').toString('utf-8');
              core.setOutput('content', content);
            } catch (e) {
              core.setOutput('content', '');
            }

      - name: Validate assignee change
        uses: actions/github-script@v7
        env:
          ROTA_CONTENT: ${{ steps.rota.outputs.content }}
        with:
          script: |
            const changes = context.payload.changes || {};
            if (!changes.assignees) return;

            const issue = context.payload.issue;
            const actor = context.payload.sender.login;
            const currentAssignees = (issue.assignees || []).map(a => a.login);

            const previousAssignees = (issue.previous_assignees || []).map(a => a.login);
            const before = new Set(previousAssignees);
            const after = new Set(currentAssignees);
            const added = [...after].filter(x => !before.has(x));
            const removed = [...before].filter(x => !after.has(x));

            const isSelfAssign = added.length === 1 && added[0] === actor;
            const isSelfUnassign = removed.length === 1 && removed[0] === actor;
            const isNetSelf = currentAssignees.length === 1 && currentAssignees[0] === actor;

            if (isSelfAssign || isSelfUnassign || isNetSelf) return;

            const m = (env.ROTA_CONTENT || '').match(/current_po:\s*(\S+)/);
            const currentPO = m ? m[1].replace(/^@/, '').replace(/["']/g, '') : null;
            const isPO = currentPO && actor === currentPO;

            if (isPO) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `🔧 PO de la semana (@${currentPO}) reasignó esta issue. El lock permite la reasignación por PO con justificación implícita.`,
              });
              return;
            }

            const desired = previousAssignees;
            await github.rest.issues.setAssignees({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              assignees: desired,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `🔒 **Asignación protegida.** Solo el assignee actual o el PO de la semana (@${currentPO || 'N/A'}) pueden modificar quién trabaja esta issue.\n\nCambio revertido a: ${desired.length ? '@' + desired.join(', @') : 'sin asignar'}.`,
            });

  cap-one-assignee:
    name: Máximo 1 assignee por issue
    if: github.event_name == 'issues' && github.event.action == 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Normalize assignees
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const currentAssignees = (issue.assignees || []).map(a => a.login);
            if (currentAssignees.length <= 1) return;

            const kept = [currentAssignees[0]];
            await github.rest.issues.setAssignees({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              assignees: kept,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number,
              body: `⚠️ **Regla "una persona por issue".** Se detectó más de un assignee (${currentAssignees.map(a => '@' + a).join(', ')}). Se dejó solo a @${kept[0]} — el resto fue removido.`,
            });

  pr-merged-status-done:
    name: PR mergeada → status:done en issues cerradas
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Swap status:claimed → status:done
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '');
            const patterns = [
              /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi,
            ];
            const refs = new Set();
            for (const re of patterns) {
              let m;
              while ((m = re.exec(body)) !== null) refs.add(parseInt(m[1], 10));
            }
            if (refs.size === 0) return;

            for (const issueNumber of refs) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                const labels = (issue.labels || []).map(l => l.name);
                if (!labels.includes('status:claimed')) continue;

                await github.rest.issues.removeLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber, name: 'status:claimed',
                });
                if (!labels.includes('status:done')) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: issueNumber, labels: ['status:done'],
                  });
                }
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: `✅ Issue cerrada vía PR #${pr.number}. \`status:claimed\` → \`status:done\` (sello histórico, no se quita).`,
                });
              } catch (e) {
                core.warning(`No se pudo procesar #${issueNumber}: ${e.message}`);
              }
            }

  pr-soft-check:
    name: Soft check en PRs que cierran issues ajenas
    if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    steps:
      - name: Read rota
        id: rota
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: '.github/ROTA.yml',
                ref: context.ref,
              });
              const content = Buffer.from(data.content, 'base64').toString('utf-8');
              core.setOutput('content', content);
            } catch (e) {
              core.setOutput('content', '');
            }

      - name: Comment on PR if author != assignee of referenced issue
        uses: actions/github-script@v7
        env:
          ROTA_CONTENT: ${{ steps.rota.outputs.content }}
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const body = (pr.body || '');
            const pattern = /\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s+#(\d+)/gi;
            const refs = new Set();
            let m;
            while ((m = pattern.exec(body)) !== null) refs.add(parseInt(m[1], 10));
            if (refs.size === 0) return;

            const m = (env.ROTA_CONTENT || '').match(/current_po:\s*(\S+)/);
            const currentPO = m ? m[1].replace(/^@/, '').replace(/["']/g, '') : null;

            for (const issueNumber of refs) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                const assignees = (issue.assignees || []).map(a => a.login);
                if (assignees.length === 0) continue;
                const assignee = assignees[0];
                if (assignee === author) continue;
                if (assignee === currentPO) continue;

                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: pr.number,
                  body: `ℹ️ Esta PR cierra #${issueNumber} (asignada a @${assignee}) pero el autor es @${author}. ¿Es intencional? Si el assignee delegó en vos, no hay problema — el comentario queda como auditoría.`,
                });
              } catch (e) {
                core.warning(`No se pudo chequear #${issueNumber}: ${e.message}`);
              }
            }
