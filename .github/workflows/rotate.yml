name: Rotate PO

on:
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  contents: write
  pull-requests: read

jobs:
  rotate:
    name: Rotar PO de la semana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute next PO
        id: next
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const yaml = fs.readFileSync('.github/ROTA.yml', 'utf-8');
            const mOrder = yaml.match(/order:\s*\[(.*?)\]/s);
            if (!mOrder) throw new Error('ROTA.yml malformado: falta `order:`');
            const order = mOrder[1].split(',').map(s => s.trim().replace(/^@/, '').replace(/^["']|["']$/g, '')).filter(Boolean);

            const mPo = yaml.match(/current_po:\s*(\S+)/);
            const currentPO = mPo ? mPo[1].replace(/^@/, '') : null;

            let nextIndex = 0;
            if (currentPO) {
              const idx = order.indexOf(currentPO);
              if (idx >= 0) nextIndex = (idx + 1) % order.length;
            }
            const nextPO = order[nextIndex];
            core.setOutput('current', currentPO || 'ninguno');
            core.setOutput('next', nextPO);
            core.setOutput('list', order.map(u => '@' + u).join(' → '));

      - name: Update ROTA.yml
        uses: actions/github-script@v7
        env:
          CURRENT: ${{ steps.next.outputs.current }}
          NEXT: ${{ steps.next.outputs.next }}
        with:
          script: |
            const fs = require('fs');
            let yaml = fs.readFileSync('.github/ROTA.yml', 'utf-8');
            yaml = yaml.replace(/current_po:\s*\S+/, `current_po: "@${process.env.NEXT}"`);
            yaml = yaml.replace(/last_rotated:\s*.*/, `last_rotated: "${new Date().toISOString().slice(0, 10)}"`);
            fs.writeFileSync('.github/ROTA.yml', yaml);

      - name: Commit ROTA.yml
        run: |
          git config user.name "alethea-bot"
          git config user.email "bot@alethea-org.local"
          git add .github/ROTA.yml
          git diff --staged --quiet || git commit -m "chore(rota): rotar PO a @${{ steps.next.outputs.next }}"
          git push

      - name: Find Triage rota issue
        id: pin
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'triage-rota', per_page: 1,
            });
            if (issues.length === 0) {
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('number', String(issues[0].number));

      - name: Update pinned Triage rota issue
        if: steps.pin.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          CURRENT: ${{ steps.next.outputs.current }}
          NEXT: ${{ steps.next.outputs.next }}
          LIST: ${{ steps.next.outputs.list }}
          ISSUE_NUMBER: ${{ steps.pin.outputs.number }}
        with:
          script: |
            const n = parseInt(process.env.ISSUE_NUMBER, 10);
            const newBody = `# 📋 Triage rota — Alethea\n\nEsta issue es la **fuente de verdad** de quién hace de Product Owner cada semana. La rotación es **automática** los lunes a las 10:00 ART.\n\n## PO actual\n\n**@${process.env.NEXT}**\n\n## Orden de rotación\n\n${process.env.LIST}\n\n## ¿Qué hace el PO?\n\n- Resolver issues con label \`triage:rotating\`.\n- Ser el punto de contacto si alguien está bloqueado.\n- **NO** tiene que asignar a nadie — los demás siguen con \`/claim\`.\n- Puede reasignar issues a quien sea, con justificación (es la única excepción al hard lock).\n\n## Cómo cambiar el orden\n\nEditar este bloque en la issue — el bot lo lee de acá:\n\n\`\`\`\n<!-- rota-order: ${process.env.LIST} -->\n<!-- current-po: @${process.env.NEXT} -->\n\`\`\`\n\n> La rotación automática sigue \`Rota.yml\`. Si querés reordenar manualmente, editá \`.github/ROTA.yml\` con un PR.\n`;
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n, body: newBody,
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: n,
              body: `🔄 **Rotación semanal.** Semana anterior cubrió @${process.env.CURRENT}. Esta semana le toca a **@${process.env.NEXT}**. ¡Éxitos!`,
            });
