app = "alethea-embeddings"
primary_region = "gru"

[build]
  image = "ollama/ollama:latest"

[mounts]
  source = "ollama_data"
  destination = "/root/.ollama"

[env]
  OLLAMA_HOST = "0.0.0.0:11434"

[[services]]
  internal_port = 11434
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
