app = "alethea-emotion"
primary_region = "gru"

[mounts]
  source = "emotion_cache"
  destination = "/home/sidecar/.cache/huggingface"

# Public demo posture (user decision, synthetic-data demo only): see the
# note in deploy/fly.embeddings.toml.
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "240s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
