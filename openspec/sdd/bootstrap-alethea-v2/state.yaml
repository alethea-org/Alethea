# ─────────────────────────────────────────────────────────────────
# Forecast adjustments (lesson from PR A)
# ─────────────────────────────────────────────────────────────────
# These multipliers are how PR B's forecast is computed. Persisted
# here so future re-forecasts (e.g., for the next change) know the
# lesson and don't re-derive it.
forecast_adjustments:
  trigger: "PR A actual 949 vs forecast 340 (2.79× over)"
  applied_to: PR-B
  multipliers:
    code_lines: 1.3
    test_lines: 1.5
    files_added: 1.0
  rationale:
    code_lines: |
      @moduledoc boundary notes ran ~30% longer than the spec-scenario
      lines alone. The 1.3× captures this for behaviour/fake modules
      that need explicit "v2 contract, wire-incompatible with legacy"
      notes.
    test_lines: |
      Original estimate assumed 1 test per spec scenario. PR A landed
      1.7 tests/requirement once triangulation (e.g., wrong-KEK,
      tampered-ciphertext), compiler-warning checks, and config-discovery
      checks were included. The 1.5× is the conservative version of
      that ratio.
    files_added: |
      File count in PR A was accurate (19 files added vs 11 forecast —
      off by 8, but those were test helper + context module + a
      foundation marker file that the original spec didn't enumerate
      separately). File count is not the bottleneck.

