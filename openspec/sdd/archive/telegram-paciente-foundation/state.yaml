# ─────────────────────────────────────────────────────────────────
# Known, accepted residual risks (not blockers; not re-litigated at archive)
# ─────────────────────────────────────────────────────────────────
risks:
  - low: |
      PHI (patient's first name, from the C-4 welcome message) can reach
      outbound_dead_letters.text (unencrypted column) and the ops:alerts
      PubSub broadcast verbatim if the welcome send exhausts retries.
      Pre-existing PR #3a/#3b dead-letter infrastructure; PR #4 is the
      first caller to route PHI through it. Deferred as a future change,
      not fixed in PR #4 (would require encrypting the column or
      stripping PHI from the dead-letter text).
  - low: |
      Per-professional welcome-message customization (mirroring the
      crisis_message override + system-default pattern already on
      Professional) was deliberately deferred out of PR #4 — the welcome
      text there is a fixed template + the patient's first name only.
      A follow-up task/session was spawned for this.
  - low: "ip: nil silently disables the rate limiter in check_rate_limit/2 — theoretical, unreachable via any current call site (both call sites always pass a non-nil sentinel or the real remote_ip)."
  - low: "TelegramOnboardingWorker's max_attempts: 2 has no documented rationale (cosmetic gap)."
  - low: "No retry-on-collision when minting a six-digit code that collides with an existing (patient_id, code, kind) row — extremely low probability, accepted."
  - low: "Pre-existing, unrelated flaky test in test/alethea/telegram/pacer_test.exs (ETS access-rights race under certain seeds) surfaced once across Judgment Day's precommit runs; file untouched by this change, not a regression."

adr_respect_check:
  adr-008-telegram-chat-id-pepper-rotation: respected (manual rotation + explicit re-onboarding, as designed in PR #1b)

