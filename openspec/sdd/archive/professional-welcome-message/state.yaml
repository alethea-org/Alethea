# ─────────────────────────────────────────────────────────────────
# Known, accepted residual risks (not blockers)
# ─────────────────────────────────────────────────────────────────
risks:
  - low: "NBSP / non-ASCII Unicode whitespace adjacent to %{name} is not collapsed (\\s is ASCII-only without Unicode property mode)."
  - low: "A resolved welcome text containing only a single letter/digit (e.g. \"%{name}1\" -> \"1\") technically passes the meaningless-message guard and ships a near-useless one-character message."
  - low: "A template where %{name} is the very first token directly touching punctuation with nothing preceding it (e.g. \"%{name}, hola\") can leave that punctuation orphaned at the start of the message once the name is unknown -- cosmetic only."
  - low: "A professional's own pre-existing double space or blank-line paragraph break anywhere in their template is now also collapsed by the global cleanup pass -- deliberately accepted trade-off (confirmed with the user in Round 3) over indefinite punctuation/quote/word-boundary special-casing."
  - low: "The known-name interpolation path does no whitespace trimming (pre-existing, not touched by any Judgment Day round)."
  - low: "Post-interpolation length is not re-validated against Telegram's 4096-char hard cap (only the raw template is validated at save time) -- low-probability compound edge case."

